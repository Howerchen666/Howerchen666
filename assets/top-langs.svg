<svg width="450" height="195" viewBox="0 0 450 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .title { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #7AA2F7; }
    .label { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #A9B1D6; }
    .val { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C0CAF5; }
  </style>

  <rect width="448" height="193" x="1" y="1" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <text x="25" y="35" class="title">Most Used Languages</text>

  <!-- Progress Bar -->
  <g clip-path="url(#bar-clip)">
    <clipPath id="bar-clip">
      <rect x="25" y="55" width="400" height="10" rx="5" />
    </clipPath>
    <rect x="25" y="55" width="174.5" height="10" fill="#F05138" /><rect x="199.5" y="55" width="123.2" height="10" fill="#3178c6" /><rect x="322.7" y="55" width="58.2" height="10" fill="#f1e05a" /><rect x="380.9" y="55" width="34.9" height="10" fill="#3572A5" /><rect x="415.79999999999995" y="55" width="5.1" height="10" fill="#663399" />
  </g>

  <!-- Legend -->
  <g>
    
    <circle cx="31" cy="91" r="5" fill="#F05138" />
    <text x="43" y="95" class="label">Swift <tspan class="val">(43.6%)</tspan></text>
        
    <circle cx="236" cy="91" r="5" fill="#3178c6" />
    <text x="248" y="95" class="label">TypeScript <tspan class="val">(30.8%)</tspan></text>
        
    <circle cx="31" cy="121" r="5" fill="#f1e05a" />
    <text x="43" y="125" class="label">JavaScript <tspan class="val">(14.5%)</tspan></text>
        
    <circle cx="236" cy="121" r="5" fill="#3572A5" />
    <text x="248" y="125" class="label">Python <tspan class="val">(8.7%)</tspan></text>
        
    <circle cx="31" cy="151" r="5" fill="#663399" />
    <text x="43" y="155" class="label">CSS <tspan class="val">(1.3%)</tspan></text>
        
  </g>
</svg>