name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run automatically daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_stats.py'

permissions:
  contents: write

jobs:
  update-stats:
    name: Generate Stats SVGs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate SVGs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: 'Howerchen666'
        run: |
          python scripts/generate_stats.py

      - name: Commit and Push Updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "📊 [Stats] Update GitHub stats cards"
            git push
          fi
